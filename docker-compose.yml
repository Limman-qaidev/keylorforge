services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${KEYLORFORGE_POSTGRES_USER:-keylorforge}
      POSTGRES_PASSWORD: ${KEYLORFORGE_POSTGRES_PASSWORD:-keylorforge_local_development_only}
      POSTGRES_DB: ${KEYLORFORGE_POSTGRES_DB:-keylorforge}
      KEYLORFORGE_POSTGRES_TEST_DB: ${KEYLORFORGE_POSTGRES_TEST_DB:-keylorforge_test}
    ports:
      - "127.0.0.1:${KEYLORFORGE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - keylorforge_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  keylorforge_postgres_data:
