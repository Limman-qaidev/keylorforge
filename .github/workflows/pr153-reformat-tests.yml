name: Temporary M3-009 Test Formatting
on:
  push:
    branches:
      - feat/m3-mob-009-offline-catalogue-ux
    paths:
      - .github/workflows/pr153-reformat-tests.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Prettier new UI test and remove temporary workflow
        run: |
          cd apps/mobile
          npx prettier --write components/exercises/__tests__/offline-exercise-browser.test.tsx
          cd ../..
          git rm .github/workflows/pr153-reformat-tests.yml
          git add apps/mobile/components/exercises/__tests__/offline-exercise-browser.test.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(m3): format async offline browser tests'
          git push origin HEAD:refs/heads/feat/m3-mob-009-offline-catalogue-ux
