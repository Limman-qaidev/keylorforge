name: Prettier debug
on:
  push:
    branches:
      - codex/cat-003-mobile-exercise-catalog

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Print exact Prettier diff
        run: |
          npx prettier --write components/exercises/__tests__/exercise-catalog-screen.test.tsx
          git diff -- components/exercises/__tests__/exercise-catalog-screen.test.tsx
