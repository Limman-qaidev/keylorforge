name: Prettier debug

on:
  push:
    branches:
      - codex/cat-003-mobile-exercise-catalog

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Print exact Prettier diff
        run: |
          npx prettier --write components/exercises/__tests__/exercise-catalog-screen.test.tsx
          git diff -- components/exercises/__tests__/exercise-catalog-screen.test.tsx
