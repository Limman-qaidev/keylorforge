name: Android Real App QA APK (isolated)


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - .github/workflows/android-real-app-qa.yml
      - apps/mobile/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-app-release:
    name: isolated-real-app-release
    # Missing QA Supabase variables means SKIPPED, never a misleading build
    # against placeholder credentials. Never expose variables to fork PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        vars.KEYLORFORGE_QA_SUPABASE_URL != '' &&
        vars.KEYLORFORGE_QA_SUPABASE_PUBLISHABLE_KEY != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: 'true'
      KEYLORFORGE_QA_REAL: '1'
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.KEYLORFORGE_QA_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.KEYLORFORGE_QA_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_APPLE_AUTH_ENABLED: 'false'
    steps:
      - name: Checkout real application sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Validate QA-only configuration and genuine app entrypoint
        run: |
          node scripts/verify-qa-variants.cjs
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*) ;;
            *) echo 'Missing/invalid QA Supabase HTTPS URL'; exit 1 ;;
          esac
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -f app/index.tsx
          ! grep -q 'KeylorForge QA Standalone' app/index.tsx

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate final resolved Android package (not just JS config)
        run: |
          npx expo config --json | node -e "
          let s = '';
          process.stdin.on('data', d => s += d);
          process.stdin.on('end', () => {
            const c = JSON.parse(s);
            if (c.android.package !== 'com.jonathansalgadonieto.keylorforge.qareal' ||
                c.scheme !== 'keylorforge-qa-real' ||
                c.android.intentFilters.length !== 0 ||
                c.extra?.m3RealQaWorkoutEnabled !== true) process.exit(1);
          });"

      - name: Prebuild isolated QA native project
        run: npx expo prebuild --platform android --no-install

      - name: Verify QA-only loopback network policy in generated Android resources
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          policy=android/app/src/main/res/xml/keylorforge_qa_loopback_network.xml
          test -s "$policy"
          grep -F 'android:networkSecurityConfig="@xml/keylorforge_qa_loopback_network"' "$manifest"
          grep -F '<base-config cleartextTrafficPermitted="false"' "$policy"
          grep -F '<domain-config cleartextTrafficPermitted="true">' "$policy"
          grep -F '<domain includeSubdomains="false">127.0.0.1</domain>' "$policy"
          ! grep -Fq 'android:usesCleartextTraffic="true"' "$manifest"

      - name: Assemble release APK containing the REAL application JS
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify package isolation and offline JS bundle
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$aapt"
          "$aapt" dump badging "$apk" | grep -F "name='com.jonathansalgadonieto.keylorforge.qareal'"
          unzip -l "$apk" | grep -F 'assets/index.android.bundle'
          # A release build without a valid signature cannot be installed for
          # QA. Check the artifact itself, not merely Gradle's SUCCESS status.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify "$apk"
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload real app QA APK (NOT the diagnostic smoke APK)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keylorforge-qa-real-app-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
