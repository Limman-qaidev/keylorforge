name: IDN-008 temporary format fix

on:
  push:
    branches:
      - feat/idn-008-social-auth

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/idn-008-social-auth

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Format social auth fixes
        working-directory: apps/mobile
        run: npx prettier --write components/auth/__tests__/social-auth-buttons.test.tsx lib/auth/__tests__/auth-provider-social.test.tsx lib/auth/social-auth.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add apps/mobile/components/auth/__tests__/social-auth-buttons.test.tsx apps/mobile/lib/auth/__tests__/auth-provider-social.test.tsx apps/mobile/lib/auth/social-auth.ts
          git commit -m "style(mobile): format social auth fixes"
          git push
