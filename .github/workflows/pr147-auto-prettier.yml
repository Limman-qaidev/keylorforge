name: Temporary M3 Machine Prettier
on:
  push:
    branches:
      - feat/m3-mob-006-machine-create-sync
    paths:
      - .github/workflows/pr147-auto-prettier.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Format, self-remove, and commit
        run: |
          cd apps/mobile
          npx prettier --write lib/workouts/machine-create-sync.ts lib/workouts/__tests__/machine-create-sync.test.ts
          cd ../..
          git rm .github/workflows/pr147-auto-prettier.yml
          git add apps/mobile/lib/workouts/machine-create-sync.ts apps/mobile/lib/workouts/__tests__/machine-create-sync.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(m3): standardize machine sync Prettier formatting'
          git push origin HEAD:refs/heads/feat/m3-mob-006-machine-create-sync
