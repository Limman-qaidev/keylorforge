name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: keylorforge_api_test
          POSTGRES_USER: keylorforge
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keylorforge -d keylorforge_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYLORFORGE_TEST_DATABASE_URL: postgresql+psycopg://keylorforge:postgres@localhost:5432/keylorforge_api_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"
          python -m pip check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest --junitxml=pytest-report.xml

      # Tests can legitimately skip PostgreSQL locally, but NEVER in CI.
      # The remote START -> SET -> FINISH/CANCEL owner/isolation/receipt gates
      # must run against the actual service container on every PR.
      - name: Enforce PostgreSQL workout integration acceptance
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter

          root = ET.parse("pytest-report.xml").getroot()
          executed = {}
          for case in root.iter("testcase"):
              executed.setdefault(case.get("name"), []).append(case)

          required = [
              "test_catalogue_repository_queries_run_against_postgresql",
              "test_free_session_start_resume_idempotency_isolation_and_purge",
              "test_real_postgres_confirmations_are_owner_scoped_atomic_and_idempotent",
              "test_postgres_finish_is_atomic_idempotent_and_owner_scoped",
              "test_cancel_is_atomic_owner_scoped_and_preserves_sets",
          ]
          for name in required:
              matches = executed.get(name, [])
              assert len(matches) == 1, (
                  f"Expected exactly one real PostgreSQL integration case {name}, "
                  f"found {len(matches)}"
              )
              case = matches[0]
              for unexpected in ("skipped", "failure", "error"):
                  assert case.find(unexpected) is None, (
                      f"PostgreSQL integration case {name} has {unexpected}"
                  )
          print(f"Verified {len(required)} real PostgreSQL integration gates")
          PY
