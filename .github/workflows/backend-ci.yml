name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: keylorforge_api_test
          POSTGRES_USER: keylorforge
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keylorforge -d keylorforge_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYLORFORGE_TEST_DATABASE_URL: postgresql+psycopg://keylorforge:postgres@localhost:5432/keylorforge_api_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"
          python -m pip check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest --junitxml=pytest-report.xml

      - name: Verify PostgreSQL catalogue integration test executed
        run: >-
          python -c "import xml.etree.ElementTree as etree; root = etree.parse('pytest-report.xml').getroot(); cases = [case for case in root.iter('testcase') if case.get('name') == 'test_catalogue_repository_queries_run_against_postgresql']; assert len(cases) == 1, f'expected one PostgreSQL catalogue integration test, found {len(cases)}'; assert cases[0].find('skipped') is None, 'PostgreSQL catalogue integration test was skipped'"
