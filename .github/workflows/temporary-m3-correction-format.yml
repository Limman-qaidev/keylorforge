name: M3 Correction Projector Format Temporary
on:
  push:
    paths:
      - .github/workflows/temporary-m3-correction-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/m3-ux-v2-dark-active-workout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Use current review HEAD
        run: |
          git fetch origin feat/m3-ux-v2-dark-active-workout
          git checkout -B feat/m3-ux-v2-dark-active-workout origin/feat/m3-ux-v2-dark-active-workout
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install pinned dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Format revision projector
        working-directory: apps/mobile
        run: |
          npx --no-install prettier --write \
            lib/workouts/finished-correction-projection.ts \
            lib/workouts/__tests__/finished-correction-projection.test.ts
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mobile/lib/workouts/finished-correction-projection.ts \
            apps/mobile/lib/workouts/__tests__/finished-correction-projection.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(m3): format immutable correction projector'
            git push origin HEAD:feat/m3-ux-v2-dark-active-workout
          fi
