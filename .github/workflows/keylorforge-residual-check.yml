name: KeylorForge residual check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  no-old-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale product-name references
        shell: bash
        run: |
          if git grep -InE 'KeylorFit|KEYLORFIT|keylorfit|Keylornet|KEYLORNET|keylornet' -- . ':!.github/workflows/keylorforge-residual-check.yml' ':!docs/design-docs/keylorforge-ui-reference/*.png' ':!docs/design-docs/keylorforge-ui-reference/*.jpg'; then
            echo 'Stale product-name references remain.' >&2
            exit 1
          fi
