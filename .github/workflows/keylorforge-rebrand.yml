name: KeylorForge one-time rebrand

on:
  push:
    branches:
      - brand/keylorforge-rebrand

permissions:
  contents: write

jobs:
  rebrand:
    if: ${{ !contains(github.event.head_commit.message, '[rebrand-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/keylorforge-rebrand
          fetch-depth: 0
      - name: Apply repository-wide product rename
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          replacements = [
              ('KEYLOR FIT', 'KEYLOR FORGE'),
              ('Keylor Fit', 'Keylor Forge'),
              ('keylor fit', 'keylor forge'),
              ('KEYLORFIT', 'KEYLORFORGE'),
              ('KeylorFit', 'KeylorForge'),
              ('keylorfit', 'keylorforge'),
          ]
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf',
              '.zip', '.woff', '.woff2', '.ttf', '.otf', '.pyc', '.db',
              '.sqlite', '.svgz',
          }

          paths = [path for path in root.rglob('*') if '.git' not in path.parts]
          for path in sorted(paths, key=lambda item: len(item.parts), reverse=True):
              new_name = path.name
              for old, new in replacements:
                  new_name = new_name.replace(old, new)
              if new_name != path.name:
                  path.rename(path.with_name(new_name))

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          brand_component = root / 'apps/mobile/components/brand/keylorforge-brand.tsx'
          text = brand_component.read_text(encoding='utf-8')
          text = text.replace('width: 184,', 'width: 208,')
          text = text.replace('width: 240,', 'width: 280,')
          brand_component.write_text(text, encoding='utf-8')

          Path('.github/workflows/keylorforge-rebrand.yml').unlink(missing_ok=True)
          PY
      - name: Commit rebrand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(brand): rebrand KeylorFit to KeylorForge [rebrand-applied]"
          git push origin HEAD:brand/keylorforge-rebrand
