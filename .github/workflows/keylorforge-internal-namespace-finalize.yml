name: KeylorForge internal namespace finalize

on:
  push:
    branches:
      - brand/keylorforge-rebrand
    paths:
      - .github/workflows/keylorforge-internal-namespace-finalize.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/keylorforge-rebrand
          fetch-depth: 0
      - name: Migrate internal namespace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv database/src/keylornet_database database/src/keylorforge_database

          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = (
              (b"KEYLORNET", b"KEYLORFORGE"),
              (b"Keylornet", b"KeylorForge"),
              (b"keylornet", b"keylorforge"),
          )
          excluded = {
              Path(".github/workflows/keylorforge-internal-namespace-finalize.yml"),
              Path(".github/workflows/database-migration.yml"),
              Path(".github/workflows/keylorforge-residual-check.yml"),
          }

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.exists() or path in excluded:
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)
          PY

          git rm .github/workflows/keylorforge-internal-namespace-finalize.yml
          git add -A
          git diff --check
          git commit -m "refactor(brand): migrate internal namespace to KeylorForge"
          git push origin HEAD:brand/keylorforge-rebrand
