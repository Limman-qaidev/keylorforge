name: M3 Notes Style Repair Temporary
on:
  push:
    paths:
      - .github/workflows/temporary-m3-notes-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/m3-ux-v2-dark-active-workout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Pinned mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Format modified TypeScript
        working-directory: apps/mobile
        run: |
          npx --no-install prettier --write \
            lib/workouts/local-exercise-notes.ts \
            lib/workouts/local-exercise-notes-sync-schema.ts \
            lib/workouts/expo-sqlite-adapter.ts \
            lib/workouts/workout-sync-coordinator.ts \
            lib/workouts/exercise-note-sync.ts \
            lib/workouts/remote-exercise-notes.ts \
            lib/workouts/__tests__/exercise-note-sync.test.ts \
            lib/workouts/__tests__/workout-sync-coordinator.test.ts \
            lib/workouts/__tests__/expo-sqlite-adapter.test.ts \
            components/workouts/free-workout-experience.tsx \
            components/workouts/workout-v2-screens.tsx
      - name: Format and lint modified Python
        run: |
          python -m pip install ruff==0.12.10
          ruff check --fix \
            database/src/keylorforge_database/models.py \
            database/src/keylorforge_database/workouts.py \
            database/migrations/versions/20261023_0001_exercise_notes.py \
            database/tests/test_migrations.py \
            database/tests/test_workout_session_schema.py \
            database/tests/test_performed_workout_schema.py \
            database/tests/test_migrations_z_machine_profiles.py \
            services/api/app/workouts/router.py \
            services/api/app/workouts/note_service.py \
            services/api/tests/test_workout_notes_postgres.py
          ruff format \
            database/src/keylorforge_database/models.py \
            database/src/keylorforge_database/workouts.py \
            database/migrations/versions/20261023_0001_exercise_notes.py \
            database/tests/test_migrations.py \
            database/tests/test_workout_session_schema.py \
            database/tests/test_performed_workout_schema.py \
            database/tests/test_migrations_z_machine_profiles.py \
            services/api/app/workouts/router.py \
            services/api/app/workouts/note_service.py \
            services/api/tests/test_workout_notes_postgres.py
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mobile/lib/workouts/local-exercise-notes.ts \
            apps/mobile/lib/workouts/local-exercise-notes-sync-schema.ts \
            apps/mobile/lib/workouts/expo-sqlite-adapter.ts \
            apps/mobile/lib/workouts/workout-sync-coordinator.ts \
            apps/mobile/lib/workouts/exercise-note-sync.ts \
            apps/mobile/lib/workouts/remote-exercise-notes.ts \
            apps/mobile/lib/workouts/__tests__/exercise-note-sync.test.ts \
            apps/mobile/lib/workouts/__tests__/workout-sync-coordinator.test.ts \
            apps/mobile/lib/workouts/__tests__/expo-sqlite-adapter.test.ts \
            apps/mobile/components/workouts/free-workout-experience.tsx \
            apps/mobile/components/workouts/workout-v2-screens.tsx \
            database/src/keylorforge_database/models.py \
            database/src/keylorforge_database/workouts.py \
            database/migrations/versions/20261023_0001_exercise_notes.py \
            database/tests/test_migrations.py \
            database/tests/test_workout_session_schema.py \
            database/tests/test_performed_workout_schema.py \
            database/tests/test_migrations_z_machine_profiles.py \
            services/api/app/workouts/router.py \
            services/api/app/workouts/note_service.py \
            services/api/tests/test_workout_notes_postgres.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(m3): normalize notes sync files with pinned tools'
            git push origin HEAD:feat/m3-ux-v2-dark-active-workout
          fi
