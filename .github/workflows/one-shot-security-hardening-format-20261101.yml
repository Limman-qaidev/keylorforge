# Ephemeral single-run formatting/test harness scoped to security branch.
name: One-time security gate hardening verification
on:
  push:
    branches:
      - security/2026-11-expo-dependency-fixes
    paths:
      - .github/workflows/one-shot-security-hardening-format-20261101.yml
permissions:
  contents: write
jobs:
  format-tests:
    if: >-
      github.repository == 'Limman-qaidev/keylorforge' &&
      github.actor == 'Limman-qaidev' &&
      github.ref == 'refs/heads/security/2026-11-expo-dependency-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/2026-11-expo-dependency-fixes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install locked mobile packages
        working-directory: apps/mobile
        run: npm ci --no-fund
      - name: Format precisely the two npm security gate sources
        working-directory: apps/mobile
        run: npx prettier --write scripts/check_npm_advisory_allowlist.mjs scripts/test_npm_advisory_gate.mjs
      - name: Commit formatting only to security branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/scripts/check_npm_advisory_allowlist.mjs apps/mobile/scripts/test_npm_advisory_gate.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(security): format minimatch guard and negative tests'
            git push origin HEAD:refs/heads/security/2026-11-expo-dependency-fixes
          fi
      - name: Exercise fail-closed gate and style
        working-directory: apps/mobile
        run: |
          node scripts/test_npm_advisory_gate.mjs
          npm run format:check
