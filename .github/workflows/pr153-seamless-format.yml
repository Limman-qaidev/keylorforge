name: Temporary seamless catalogue formatting
on:
  push:
    branches:
      - feat/m3-mob-009-offline-catalogue-ux
    paths:
      - .github/workflows/pr153-seamless-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Format integrated catalogue and tests, self-remove
        run: |
          cd apps/mobile
          npx prettier --write components/exercises/exercise-catalog-screen.tsx components/exercises/__tests__/exercise-catalog-screen.test.tsx lib/exercises/use-cached-exercise-catalogue.ts lib/exercises/__tests__/use-cached-exercise-catalogue.test.tsx app/train.tsx
          cd ../..
          git rm .github/workflows/pr153-seamless-format.yml
          git add apps/mobile/components/exercises/exercise-catalog-screen.tsx apps/mobile/components/exercises/__tests__/exercise-catalog-screen.test.tsx apps/mobile/lib/exercises/use-cached-exercise-catalogue.ts apps/mobile/lib/exercises/__tests__/use-cached-exercise-catalogue.test.tsx apps/mobile/app/train.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(m3): format seamless catalogue integration'
          git push origin HEAD:refs/heads/feat/m3-mob-009-offline-catalogue-ux
