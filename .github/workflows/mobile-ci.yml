name: Mobile CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-quality:
    name: mobile-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Diagnose Prettier cancellation changes (temporary)
        if: failure()
        run: |
          npx prettier --write lib/workouts/local-cancel.ts lib/workouts/local-cancel-schema.ts lib/workouts/__tests__/local-cancel.test.ts lib/workouts/free-workout-flow.ts lib/workouts/__tests__/free-workout-flow.test.ts components/workouts/free-workout-experience.tsx
          git diff -- lib/workouts/local-cancel.ts lib/workouts/local-cancel-schema.ts lib/workouts/__tests__/local-cancel.test.ts lib/workouts/free-workout-flow.ts lib/workouts/__tests__/free-workout-flow.test.ts components/workouts/free-workout-experience.tsx

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Verify SQLite v1-to-v2 migration against real SQLite
        run: python3 scripts/test_workout_sqlite_migration.py

      - name: Run tests
        run: npm test
