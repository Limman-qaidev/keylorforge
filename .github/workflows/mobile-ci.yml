name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-quality:
    name: mobile-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # TEMP QA diagnostic: use exact formatter output, remove before acceptance.
      - name: Diagnose new QA formatting
        run: |
          ./node_modules/.bin/prettier --write app/workout-offline-qa.tsx lib/workouts/offline-e2e-qa.ts lib/workouts/remote-e2e-qa.ts
          git diff -- app/workout-offline-qa.tsx lib/workouts/offline-e2e-qa.ts lib/workouts/remote-e2e-qa.ts
      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Verify SQLite v1-to-v2 migration against real SQLite
        run: python3 scripts/test_workout_sqlite_migration.py

      - name: Run tests
        run: npm test
