name: Mobile CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-quality:
    name: mobile-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # TEMPORARY: capture exact formatting of new isolated v3 files.
      - name: Export machine v3 formatted files
        run: |
          printf 'M3_V3_SOURCE:%s\\n' "$(npx prettier lib/workouts/local-machine-store.ts | base64 -w0)"
          printf 'M3_V3_SCHEMA:%s\\n' "$(npx prettier lib/workouts/local-machine-schema.ts | base64 -w0)"
          printf 'M3_V3_TEST:%s\\n' "$(npx prettier lib/workouts/__tests__/local-machine-store.test.ts | base64 -w0)"

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Verify SQLite v1-to-v2 migration against real SQLite
        run: python3 scripts/test_workout_sqlite_migration.py

      - name: Run tests
        run: npm test
