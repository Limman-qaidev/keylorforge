name: Mobile CI

on:
  pull_request:
    branches:
      - main
      - feat/m3-mob-010-local-finish-schema
      - feat/m3-mob-012-remote-history-readmodel
      - feat/m3-mob-013-unified-history-readmodel
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-quality:
    name: mobile-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Verify SQLite v1-to-v2 migration against real SQLite
        run: python3 scripts/test_workout_sqlite_migration.py

      - name: Run tests
        run: npm test
