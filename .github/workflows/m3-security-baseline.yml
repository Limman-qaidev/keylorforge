# Security baseline: Semgrep and Python are blocking; known npm findings are allowlisted until remediated.
# No Codex, no tokens, no write permissions, no uploads of potentially exposed secrets.
# This is a regression gate, not a declaration of production release safety.
name: M3 Security Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE (OWASP)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Static code security scan
        id: scan
        run: semgrep scan --config p/owasp-top-ten --error --json --output semgrep-report.json .
      - name: Explain baseline result
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        shell: sh
        run: |
          echo "### Semgrep CE — informative security baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: $SCAN_OUTCOME. Failed means findings or scanner errors; inspect report and runner logs." >> "$GITHUB_STEP_SUMMARY"
          echo "This is NOT independent human review, and a passing scan does NOT certify security." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-secret code findings for triage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3-semgrep-owasp
          path: semgrep-report.json
          if-no-files-found: ignore
          retention-days: 7

  mobile-dependencies:
    name: npm production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Audit committed mobile lockfile
        id: audit
        continue-on-error: true
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=high --json > npm-security-report.json
      # This check blocks new findings but retains the documented existing debt.
      - name: Reject new or critical npm advisories
        working-directory: apps/mobile
        run: node scripts/check_npm_advisory_allowlist.mjs npm-security-report.json

      # Temporary read-only CI workspace trial; never commit automatically.
      - name: Inspect nonbreaking transitive npm fixes
        working-directory: apps/mobile
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund --no-audit || true
          echo "=== PATCH TARGETS ==="
          node -e 'const p=require("./package-lock.json").packages; for(const [key,val] of Object.entries(p)){if(["brace-expansion","compression","source-map-js"].some(n=>key.endsWith("node_modules/"+n))) console.log(JSON.stringify({path:key,version:val.version,resolved:val.resolved,integrity:val.integrity,dependencies:val.dependencies,engines:val.engines}));}'
          echo "=== PATCH STATS ==="
          git diff --stat -- package-lock.json
      - name: Explain baseline result
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "### npm dependencies — informative security baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: $AUDIT_OUTCOME. A failure can mean high/critical advisories or registry connectivity." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve dependency advisory report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3-npm-advisories
          path: apps/mobile/npm-security-report.json
          if-no-files-found: ignore
          retention-days: 7

  python-dependencies:
    name: Python pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install vulnerability checker
        run: python -m pip install 'pip-audit>=2.9,<3'
      - name: Audit API dependency constraints
        id: api
        run: pip-audit --no-deps -r services/api/constraints.txt -f json -o api-python-security-report.json
      - name: Audit database dependency constraints
        id: database
        run: pip-audit --no-deps -r database/constraints.txt -f json -o db-python-security-report.json
      - name: Explain baseline result
        if: always()
        env:
          API_AUDIT_OUTCOME: ${{ steps.api.outcome }}
          DB_AUDIT_OUTCOME: ${{ steps.database.outcome }}
        run: |
          echo "### Python dependencies — informative security baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "API outcome: $API_AUDIT_OUTCOME; database outcome: $DB_AUDIT_OUTCOME." >> "$GITHUB_STEP_SUMMARY"
          echo "Review findings and distinguish CVEs from resolver/index problems before making checks blocking." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve dependency advisory reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m3-python-advisories
          path: |
            api-python-security-report.json
            db-python-security-report.json
          if-no-files-found: ignore
          retention-days: 7
