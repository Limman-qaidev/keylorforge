# TEMPORARY: emits formatter-normalized UTF-8 sources for this isolated QA PR.
# Remove this workflow immediately after applying the normalized sources.
name: M3 QA formatting helper
on:
  push:
    branches:
      - feat/m3-qa-real-transport-isolated
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd apps/mobile
          npm ci --no-audit --no-fund
          ./node_modules/.bin/prettier --write app/workout-remote-qa.tsx lib/workouts/remote-e2e-qa.ts lib/workouts/expo-sqlite-adapter.ts
          cd ../..
          python -m pip install ruff==0.12.10
          ruff format services/api/app/qa_m3.py
      - name: Print normalized file chunks for patching
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
            'apps/mobile/app/workout-remote-qa.tsx',
            'apps/mobile/lib/workouts/remote-e2e-qa.ts',
            'apps/mobile/lib/workouts/expo-sqlite-adapter.ts',
            'services/api/app/qa_m3.py',
          ]
          for index, path in enumerate(paths):
              content = Path(path).read_text(encoding='utf-8')
              for chunk, start in enumerate(range(0, len(content), 1800)):
                  print('QA_FORMAT::' + str(index) + '::' + str(chunk) + '::' + json.dumps(content[start:start+1800], ensure_ascii=True))
              print('QA_FORMAT_END::' + str(index))
          PY
