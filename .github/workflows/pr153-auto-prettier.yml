name: Temporary M3-009 Prettier
on:
  push:
    branches:
      - feat/m3-mob-009-offline-catalogue-ux
    paths:
      - .github/workflows/pr153-auto-prettier.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Format UI and tests then self-remove
        run: |
          cd apps/mobile
          npx prettier --write app/train.tsx app/offline-exercises.tsx app/__tests__/authenticated-destinations.test.tsx components/exercises/offline-exercise-browser.tsx components/exercises/__tests__/offline-exercise-browser.test.tsx
          cd ../..
          git rm .github/workflows/pr153-auto-prettier.yml
          git add apps/mobile/app/train.tsx apps/mobile/app/offline-exercises.tsx apps/mobile/app/__tests__/authenticated-destinations.test.tsx apps/mobile/components/exercises/offline-exercise-browser.tsx apps/mobile/components/exercises/__tests__/offline-exercise-browser.test.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(m3): format production offline catalogue browser'
          git push origin HEAD:refs/heads/feat/m3-mob-009-offline-catalogue-ux
