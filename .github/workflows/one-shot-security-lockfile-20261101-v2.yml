# Temporary one-time trusted-user dependency remediation workflow.
name: One-shot finish minimatch advisory fix
on:
  push:
    branches:
      - security/2026-11-expo-dependency-fixes
    paths:
      - .github/workflows/one-shot-security-lockfile-20261101-v2.yml

permissions:
  contents: write

jobs:
  regenerate-and-audit:
    if: >-
      github.repository == 'Limman-qaidev/keylorforge' &&
      github.actor == 'Limman-qaidev' &&
      github.ref == 'refs/heads/security/2026-11-expo-dependency-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/2026-11-expo-dependency-fixes
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Verify pinned targeted security overrides
        run: |
          node -e 'const o=require("./apps/mobile/package.json").overrides;if(o["@typescript-eslint/typescript-estree"].minimatch!=="11.0.1"||o["node-forge"]!=="1.4.1"||o["@expo/fingerprint"].glob!=="14.0.2")process.exit(1)'
      - name: Regenerate checked-in lockfile
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to dedicated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security(npm): lock patched typescript-eslint minimatch dependency'
            git push origin HEAD:refs/heads/security/2026-11-expo-dependency-fixes
          fi
      - name: Check installation and security scanner
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npm ci --no-fund
          npm audit --omit=dev --audit-level=high --json > /tmp/mobile-audit.json || true
          node scripts/check_npm_advisory_allowlist.mjs /tmp/mobile-audit.json
      - name: Validate Expo configuration and mobile quality
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo config --json > /tmp/expo-config.json
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --ci --runInBand
