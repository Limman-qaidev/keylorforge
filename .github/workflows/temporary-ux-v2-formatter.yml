name: TEMP UX v2 formatter diagnostics
on:
  push:
    branches:
      - feat/m3-ux-v2-dark-active-workout
permissions:
  contents: read
jobs:
  prettier-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - name: Format source and print exact normalized text for surgical application
        working-directory: apps/mobile
        run: |
          npx prettier --write components/workouts/workout-v2-screens.tsx
          node - <<'NODE'
          const fs = require('fs');
          const code = fs.readFileSync('components/workouts/workout-v2-screens.tsx', 'utf8');
          console.log('KF_PRETTIER_LENGTH=' + code.length);
          for (let i = 0; i < code.length; i += 1200) {
            console.log('KF_PRETTIER_CHUNK ' + i + ' ' + JSON.stringify(code.slice(i, i + 1200)));
          }
          NODE
