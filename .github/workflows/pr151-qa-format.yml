name: Temporary M3-008 QA Formatting
on:
  push:
    branches:
      - feat/m3-mob-008-offline-exercise-cache
    paths:
      - .github/workflows/pr151-qa-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Format QA screen and remove temporary workflow
        run: |
          cd apps/mobile
          npx prettier --write app/workout-storage-qa.tsx
          cd ../..
          git rm .github/workflows/pr151-qa-format.yml
          git add apps/mobile/app/workout-storage-qa.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(m3): format native offline catalogue QA screen'
          git push origin HEAD:refs/heads/feat/m3-mob-008-offline-exercise-cache
